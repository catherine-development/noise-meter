<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assessments · NOR140</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#eef0f4;--surface:#fff;--panel:#f5f6f9;--border:#dde1e9;
  --text:#1b1e26;--text2:#575f74;--text3:#99a0ae;
  --accent:#f07d14;--laeq:#2672e0;
  --ok:#16a34a;--ok-bg:rgba(22,163,74,.09);
  --warn:#dc2626;--warn-bg:rgba(220,38,38,.09);
  --day-c:#92400e;--day-bg:#fffbeb;--day-dm:rgba(146,64,14,.12);
  --eve-c:#5b21b6;--eve-bg:#ede9fe;--eve-dm:rgba(91,33,182,.12);
  --ngt-c:#075985;--ngt-bg:#e0f2fe;--ngt-dm:rgba(7,89,133,.12);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0e12;--surface:#16181f;--panel:#1e2028;--border:#2a2d38;
  --text:#e8eaf0;--text2:#8b90a0;--text3:#5a6070;
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.1);--warn:#ef4444;--warn-bg:rgba(239,68,68,.1);
  --day-c:#fbbf24;--day-bg:rgba(251,191,36,.09);--day-dm:rgba(251,191,36,.16);
  --eve-c:#a78bfa;--eve-bg:rgba(167,139,250,.09);--eve-dm:rgba(167,139,250,.16);
  --ngt-c:#38bdf8;--ngt-bg:rgba(56,189,248,.09);--ngt-dm:rgba(56,189,248,.16);
}}
:root[data-theme="dark"]{
  --bg:#0d0e12;--surface:#16181f;--panel:#1e2028;--border:#2a2d38;
  --text:#e8eaf0;--text2:#8b90a0;--text3:#5a6070;
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.1);--warn:#ef4444;--warn-bg:rgba(239,68,68,.1);
  --day-c:#fbbf24;--day-bg:rgba(251,191,36,.09);--day-dm:rgba(251,191,36,.16);
  --eve-c:#a78bfa;--eve-bg:rgba(167,139,250,.09);--eve-dm:rgba(167,139,250,.16);
  --ngt-c:#38bdf8;--ngt-bg:rgba(56,189,248,.09);--ngt-dm:rgba(56,189,248,.16);
}
:root[data-theme="light"]{
  --bg:#eef0f4;--surface:#fff;--panel:#f5f6f9;--border:#dde1e9;
  --text:#1b1e26;--text2:#575f74;--text3:#99a0ae;
  --ok:#16a34a;--ok-bg:rgba(22,163,74,.09);--warn:#dc2626;--warn-bg:rgba(220,38,38,.09);
  --day-c:#92400e;--day-bg:#fffbeb;--day-dm:rgba(146,64,14,.12);
  --eve-c:#5b21b6;--eve-bg:#ede9fe;--eve-dm:rgba(91,33,182,.12);
  --ngt-c:#075985;--ngt-bg:#e0f2fe;--ngt-dm:rgba(7,89,133,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45}
a{color:inherit}
button,input,select,textarea{font-family:inherit}

/* Nav */
.nav{height:44px;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;gap:2px;flex-shrink:0;overflow-x:auto}
.nav-logo{font-size:13px;font-weight:700;padding-right:14px;margin-right:6px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.nav-tab{color:var(--text2);text-decoration:none;padding:0 12px;height:44px;display:flex;align-items:center;border-bottom:2px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;transition:color .12s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-add{margin-left:auto;background:var(--accent);color:#fff;border-radius:5px;font-size:12px;font-weight:600;padding:5px 12px;text-decoration:none;flex-shrink:0;white-space:nowrap}
.nav-add:hover{opacity:.88}
.nav-out{color:var(--text3);text-decoration:none;font-size:12px;padding:0 8px;flex-shrink:0;margin-left:4px}

/* App shell */
.app{display:flex;height:calc(100vh - 44px);overflow:hidden}

/* Sidebar */
.sidebar{width:256px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);overflow:hidden}
.sidebar-top{padding:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.btn-new{width:100%;padding:7px 12px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .12s}
.btn-new:hover{opacity:.88}
.sidebar-scroll{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}

/* Assessment card */
.a-card{border-radius:5px;border:1px solid var(--border);padding:10px 12px;cursor:pointer;background:var(--panel);transition:background .1s,border-color .12s}
.a-card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.a-card.active{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:2px}
.card-purpose{font-size:11px;color:var(--text3);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.std-pill{font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;background:var(--panel);color:var(--text3);border:1px solid var(--border);letter-spacing:.02em}
.card-counts{font-size:11px;color:var(--text3);margin-left:auto}
.card-dates{font-size:11px;color:var(--text3);width:100%;margin-top:3px}
.sidebar-empty{padding:20px 12px;font-size:12px;color:var(--text3);text-align:center;font-style:italic}

/* Detail */
.detail{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3)}
.detail-empty svg{opacity:.3}
.detail-empty p{font-size:13px;font-style:italic}
#assess-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Assessment header */
.a-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;flex-shrink:0}
.hdr-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.hdr-name{font-size:16px;font-weight:700;flex:1;min-width:0;line-height:1.25}
.hdr-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:4px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:background .1s}
.btn-sm:hover{background:var(--border)}
.btn-sm.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.btn-sm.danger:hover{background:var(--warn-bg)}
.hdr-meta{font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hdr-sep{color:var(--border)}

/* Coverage matrix */
.coverage{display:flex;flex-direction:column;gap:5px}
.cov-row{display:flex;align-items:center;gap:8px}
.cov-loc{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.03em;width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.cov-chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
.chip-day{background:var(--day-bg);color:var(--day-c)}
.chip-eve{background:var(--eve-bg);color:var(--eve-c)}
.chip-ngt{background:var(--ngt-bg);color:var(--ngt-c)}
.chip-pre{background:var(--day-bg);color:var(--day-c)}
.chip-post{background:var(--ngt-bg);color:var(--ngt-c)}
.chip-empty{background:var(--panel);color:var(--text3);border:1px dashed var(--border)}
.cov-plabel{font-size:9px;letter-spacing:.04em;text-transform:uppercase;opacity:.7}

/* Split panel */
.split{flex:1;display:flex;overflow:hidden}

/* Pool */
.pool{flex:1.8;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;min-width:0}
.panel-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
.panel-count{font-size:11px;color:var(--text3)}
.pool-filters{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.pool-search{flex:1;padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);outline:none;transition:border-color .12s}
.pool-search:focus{border-color:var(--laeq)}
.toggle-btn{font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer;white-space:nowrap;user-select:none;transition:all .1s}
.toggle-btn.on{background:color-mix(in srgb,var(--laeq) 10%,transparent);border-color:color-mix(in srgb,var(--laeq) 40%,transparent);color:var(--laeq)}
.pool-body{flex:1;overflow-y:auto}

/* Run items */
.run-item{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .08s;font-size:12px;border-left:3px solid transparent}
.run-item:hover{background:var(--panel)}
.run-item.sel{background:color-mix(in srgb,var(--laeq) 7%,transparent)}
.run-item.assigned{opacity:.5}
.run-item.hidden{display:none}
.run-item.p-day{border-left-color:var(--day-c)}
.run-item.p-eve{border-left-color:var(--eve-c)}
.run-item.p-ngt{border-left-color:var(--ngt-c)}
.run-item.p-pre{border-left-color:var(--day-c)}
.run-item.p-post{border-left-color:var(--ngt-c)}
.run-item.add-mode{cursor:pointer}
.run-item.add-mode:hover{background:color-mix(in srgb,var(--laeq) 6%,var(--panel))}
.run-add-btn{font-size:11px;font-weight:700;color:var(--laeq);background:color-mix(in srgb,var(--laeq) 10%,transparent);border:1px solid color-mix(in srgb,var(--laeq) 30%,transparent);border-radius:3px;padding:1px 6px;flex-shrink:0;pointer-events:none}
.ri-date{font-weight:600;color:var(--text);min-width:84px;flex-shrink:0}
.ri-n{color:var(--text3);min-width:22px;flex-shrink:0;font-size:11px}
.ri-time{color:var(--text3);min-width:36px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ri-dur{color:var(--text3);min-width:42px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ri-avg{font-weight:700;color:var(--text);min-width:56px;font-variant-numeric:tabular-nums;flex-shrink:0}
.ri-right{display:flex;gap:3px;margin-left:auto;flex-shrink:0;align-items:center;padding-right:8px}
.ppill{font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px}
.pp-day{background:var(--day-dm);color:var(--day-c)}
.pp-eve{background:var(--eve-dm);color:var(--eve-c)}
.pp-ngt{background:var(--ngt-dm);color:var(--ngt-c)}
.pp-pre{background:var(--day-dm);color:var(--day-c)}
.pp-post{background:var(--ngt-dm);color:var(--ngt-c)}
.badge-loc{font-size:10px;padding:1px 5px;border-radius:3px;background:color-mix(in srgb,var(--laeq) 12%,transparent);color:var(--laeq);font-weight:600}
.pool-empty{padding:24px;text-align:center;font-size:12px;color:var(--text3);font-style:italic}

/* Selection bar */
.pool-ctx{display:none;align-items:center;gap:8px;padding:6px 12px;background:color-mix(in srgb,var(--laeq) 7%,var(--surface));border-bottom:2px solid var(--laeq);flex-shrink:0;font-size:12px}
.pool-ctx.vis{display:flex}
.pool-ctx-lbl{flex:1;color:var(--text2)}
.pool-ctx-lbl strong{color:var(--laeq)}
.pool-ctx-done{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid color-mix(in srgb,var(--laeq) 40%,transparent);background:transparent;color:var(--laeq);cursor:pointer}
.pool-ctx-done:hover{background:color-mix(in srgb,var(--laeq) 10%,transparent)}

/* Locations panel */
.locs{flex:2.2;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.loc-card.active .loc-hdr{background:color-mix(in srgb,var(--laeq) 7%,var(--surface));border-left:3px solid var(--laeq)}
.loc-card.active .loc-avatar{background:color-mix(in srgb,var(--laeq) 22%,transparent);color:var(--laeq)}
.locs-body{flex:1;overflow-y:auto}

/* Location card */
.loc-card{border-bottom:1px solid var(--border)}
.loc-hdr{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--surface)}
.loc-avatar{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--laeq) 14%,transparent);color:var(--laeq);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-label{font-size:13px;font-weight:700;color:var(--text);flex-shrink:0;white-space:nowrap;border-radius:3px;padding:2px 5px;outline:none;border:1px solid transparent;background:transparent;cursor:text;min-width:20px}
.loc-label:hover{border-color:var(--border);background:var(--panel)}
.loc-label:focus{border-color:var(--laeq);background:var(--surface)}
.loc-desc-field{flex:1;font-size:12px;color:var(--text3);border-radius:3px;padding:2px 5px;outline:none;border:1px solid transparent;background:transparent;cursor:text;min-width:60px}
.loc-desc-field:hover{border-color:var(--border);background:var(--panel)}
.loc-desc-field:focus{border-color:var(--laeq);background:var(--surface);color:var(--text)}
.loc-desc-field:empty:not(:focus)::before{content:attr(data-placeholder);color:var(--text3);font-style:italic}
.loc-cnt{font-size:11px;color:var(--text3);flex-shrink:0;white-space:nowrap}
.loc-del{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer;flex-shrink:0}
.loc-del:hover{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg)}
.loc-runs{background:var(--panel)}
.loc-run-row{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 49px;border-top:1px solid var(--border);font-size:12px}
.lrr-date{font-weight:600;color:var(--text);min-width:84px;flex-shrink:0}
.lrr-time{color:var(--text2);min-width:36px;flex-shrink:0;font-variant-numeric:tabular-nums}
.lrr-avg{font-weight:700;color:var(--text);min-width:52px;flex-shrink:0;font-variant-numeric:tabular-nums}
.lrr-cond{flex:1;padding:2px 6px;font-size:11px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--text2);min-width:0}
.lrr-cond:hover{background:var(--surface);border-color:var(--border)}
.lrr-cond:focus{outline:none;background:var(--surface);border-color:var(--laeq)}
.lrr-cond::placeholder{color:var(--text3)}
.lrr-rm{cursor:pointer;color:var(--text3);padding:1px 4px;border-radius:3px;font-size:15px;line-height:1;flex-shrink:0}
.lrr-rm:hover{color:var(--warn);background:var(--warn-bg)}
.loc-empty{padding:10px 14px 10px 49px;font-size:11px;color:var(--text3);font-style:italic}

/* Add location */
.add-loc-wrap{padding:10px 14px;border-bottom:1px solid var(--border)}
.add-loc-trigger{width:100%;padding:6px 12px;font-size:12px;color:var(--text2);background:none;border:1px dashed var(--border);border-radius:4px;cursor:pointer;text-align:left;transition:background .1s,color .1s}
.add-loc-trigger:hover{background:var(--panel);color:var(--text);border-style:solid;border-color:var(--text3)}
.add-loc-form{display:none;flex-direction:column;gap:7px}
.add-loc-form.open{display:flex}
.add-inputs{display:flex;gap:7px}
.loc-inp{padding:6px 9px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);outline:none}
.loc-inp:focus{border-color:var(--laeq)}
.add-actions{display:flex;gap:6px}
.btn-xs-p{padding:4px 10px;font-size:12px;background:var(--laeq);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600}
.btn-xs-s{padding:4px 10px;font-size:12px;background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:4px;cursor:pointer}

/* Modal */
.modal-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bd.open{display:flex}
.modal{background:var(--surface);border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.25);width:540px;max-width:calc(100vw - 32px);max-height:90vh;overflow-y:auto}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
.modal-body{padding:16px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-row{margin-bottom:12px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.form-input{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text)}
.form-input:focus{outline:none;border-color:var(--laeq)}
.btn-primary{padding:6px 14px;background:var(--laeq);color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{opacity:.85}
.btn-secondary{padding:6px 14px;background:var(--panel);color:var(--text2);border:1px solid var(--border);border-radius:4px;font-size:13px;cursor:pointer}
.btn-secondary:hover{background:var(--border)}

@media(max-width:800px){
  .sidebar{width:200px}
  .split{flex-direction:column}
  .pool{flex:none;height:45vh;border-right:none;border-bottom:1px solid var(--border)}
  .locs{flex:1}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">NOR140 · {{ pi_name }}</div>
  <a href="/" class="nav-tab">Sessions</a>
  <a href="/assessments" class="nav-tab active">Assessments</a>
  <a href="/manage" class="nav-tab">Manage</a>
  <a href="/reports" class="nav-tab">Reports</a>
  <a href="/help" class="nav-tab">Help</a>
  <a href="/upload" class="nav-add">+ Add</a>
  <a href="/logout" class="nav-out">Sign out</a>
</nav>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="btn-new" onclick="showNewAssessment()">+ New Assessment</button>
    </div>
    <div class="sidebar-scroll" id="sidebar-list"></div>
  </aside>

  <main class="detail">
    <div class="detail-empty" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
      <p>Select an assessment to start working</p>
    </div>

    <div id="assess-panel" style="display:none">
      <div class="a-hdr" id="a-hdr"></div>
      <div class="split">
        <div class="pool">
          <div class="panel-hdr">
            <span class="panel-title">Available Runs</span>
            <span class="panel-count" id="pool-count"></span>
          </div>
          <div class="pool-filters">
            <input type="search" id="pool-search" class="pool-search" placeholder="Filter by date, dB…">
            <button class="toggle-btn" id="show-assigned-btn" onclick="toggleShowAssigned()">Show assigned</button>
          </div>
          <div class="pool-ctx" id="pool-ctx">
            <span class="pool-ctx-lbl" id="pool-ctx-lbl"></span>
            <button class="pool-ctx-done" onclick="clearActiveLoc()">Done</button>
          </div>
          <div class="pool-body" id="pool-body"></div>
        </div>

        <div class="locs">
          <div class="panel-hdr">
            <span class="panel-title">Sub-locations</span>
          </div>
          <div class="locs-body" id="locs-body"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Assessment create/edit modal -->
<div id="assessModal" class="modal-bd" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hdr" id="modalTitle">New Assessment</div>
    <form id="assessForm" class="modal-body" onsubmit="event.preventDefault();submitAssessForm()">
      <input type="hidden" id="assessFormId">
      <div class="form-row">
        <label class="form-label">Assessment name *</label>
        <input id="fName" class="form-input" placeholder="e.g. 8 Manor Road – Noise Nuisance Investigation" required>
      </div>
      <div class="form-row">
        <label class="form-label">Purpose / brief description</label>
        <input id="fPurpose" class="form-input" placeholder="e.g. Statutory noise nuisance – EPA 1990 s.79">
      </div>
      <div class="form-row-2 form-row">
        <div>
          <label class="form-label">Standard</label>
          <select id="fStandard" class="form-input" style="cursor:pointer">
            <option value="noise_act">Noise Act (pre/post 23:00)</option>
            <option value="bs4142">BS 4142 (Day/Evening/Night)</option>
          </select>
        </div>
        <div>
          <label class="form-label">Client reference</label>
          <input id="fClientRef" class="form-input" placeholder="e.g. ENF/2026/0142">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Address</label>
        <input id="fAddress" class="form-input" placeholder="e.g. 8 Manor Road, Anytown">
      </div>
      <div class="form-row-2 form-row">
        <div>
          <label class="form-label">Postcode</label>
          <input id="fPostcode" class="form-input" placeholder="e.g. AB1 2CD">
        </div>
        <div></div>
      </div>
      <div class="form-row">
        <label class="form-label">Notes</label>
        <textarea id="fNotes" class="form-input" rows="3" style="resize:vertical" placeholder="Background, weather conditions, general context…"></textarea>
      </div>
    </form>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAssessForm()">Save</button>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const S = {
  assessments: [],
  currentId: null,
  current: null,
  activeLoc: null,
  showAssigned: false,
  filterText: '',
};

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  return `${parseInt(day)} ${MONTHS[parseInt(m)-1]} ${y}`;
}

function fmtDur(n, step) {
  const s = (n || 0) * (step || 1);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function timePeriod(t, std) {
  const h = parseInt((t || '00').split(':')[0]);
  if (std === 'bs4142') {
    if (h >= 7 && h < 19) return 'Day';
    if (h >= 19 && h < 23) return 'Evening';
    return 'Night';
  }
  return (h >= 23 || h < 7) ? 'Post 23:00' : 'Pre 23:00';
}

function periodKey(p) {
  return { Day:'day', Evening:'eve', Night:'ngt', 'Pre 23:00':'pre', 'Post 23:00':'post' }[p] || 'day';
}

function periods(std) {
  return std === 'bs4142' ? ['Day','Evening','Night'] : ['Pre 23:00','Post 23:00'];
}

function shortPeriod(p) {
  return { Day:'Day', Evening:'Eve', Night:'Night', 'Pre 23:00':'Pre-23', 'Post 23:00':'Post-23' }[p] || p;
}

// ── Sidebar ─────────────────────────────────────────────────
async function loadAssessments() {
  const res = await fetch('/api/assessments');
  S.assessments = await res.json();
  renderSidebar();
}

function renderSidebar() {
  const el = document.getElementById('sidebar-list');
  if (!S.assessments.length) {
    el.innerHTML = '<div class="sidebar-empty">No assessments yet — click <strong>+ New Assessment</strong> to get started.</div>';
    return;
  }
  el.innerHTML = S.assessments.map(a => {
    const std = a.standard === 'bs4142' ? 'BS 4142' : 'Noise Act';
    const locText = `${a.loc_count || 0} loc${a.loc_count !== 1 ? 's' : ''}`;
    const runText = `${a.run_count || 0} run${a.run_count !== 1 ? 's' : ''}`;
    const dates = a.date_from
      ? fmtDate(a.date_from) + (a.date_to && a.date_to !== a.date_from ? ' – ' + fmtDate(a.date_to) : '')
      : null;
    return `<div class="a-card${S.currentId === a.id ? ' active' : ''}" onclick="openAssessment(${a.id})">
      <div class="card-name">${esc(a.name)}</div>
      ${a.purpose ? `<div class="card-purpose">${esc(a.purpose)}</div>` : ''}
      <div class="card-row">
        <span class="std-pill">${std}</span>
        <span class="card-counts">${locText} · ${runText}</span>
      </div>
      ${dates ? `<div class="card-dates">${dates}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Assessment header ────────────────────────────────────────
function renderHeader() {
  const a = S.current.assessment;
  const std = a.standard === 'bs4142' ? 'BS 4142' : 'Noise Act';
  const ps = periods(a.standard);

  // Coverage from location runs
  const covHtml = a.locations.map(loc => {
    const counts = {};
    for (const p of ps) counts[p] = 0;
    for (const r of loc.runs) {
      const p = timePeriod(r.start_time, a.standard);
      if (counts[p] !== undefined) counts[p]++;
    }
    const chipsHtml = ps.map(p => {
      const n = counts[p];
      const k = periodKey(p);
      return n > 0
        ? `<span class="chip chip-${k}"><span class="cov-plabel">${p}</span> ×${n}</span>`
        : `<span class="chip chip-empty"><span class="cov-plabel">${p}</span> —</span>`;
    }).join('');
    const locName = [loc.label, loc.description].filter(Boolean).join(' — ');
    return `<div class="cov-row">
      <div class="cov-loc" title="${esc(locName)}">${esc(locName)}</div>
      <div class="cov-chips">${chipsHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('a-hdr').innerHTML = `
    <div class="hdr-top">
      <div class="hdr-name">${esc(a.name)}</div>
      <div class="hdr-actions">
        <a href="/export/assessment/${a.id}.csv" class="btn-sm">Export CSV</a>
        <button class="btn-sm" onclick="showEditAssessment()">Edit Details</button>
        <button class="btn-sm danger" onclick="confirmDeleteAssessment(${a.id})">Delete</button>
      </div>
    </div>
    <div class="hdr-meta">
      ${a.client_ref ? `<strong>Ref:</strong> ${esc(a.client_ref)}<span class="hdr-sep">|</span>` : ''}
      <span class="std-pill">${std}</span>
      ${a.address ? `<span class="hdr-sep">|</span>${esc(a.address)}${a.postcode ? ', ' + esc(a.postcode) : ''}` : ''}
      ${a.purpose ? `<span class="hdr-sep">|</span><span style="color:var(--text3)">${esc(a.purpose)}</span>` : ''}
    </div>
    <div class="coverage">${covHtml || '<span style="font-size:11px;color:var(--text3);font-style:italic">Add sub-locations to see coverage.</span>'}</div>`;
}

// ── Run pool ─────────────────────────────────────────────────
function renderPool() {
  const a = S.current.assessment;
  const needle = S.filterText.toLowerCase();
  const activeLoc = S.activeLoc ? a.locations.find(l => l.id === S.activeLoc) : null;
  const activeArIds = activeLoc ? new Set(activeLoc.runs.map(r => r.ar_id)) : new Set();
  let visible = 0;

  // Context bar
  const ctx = document.getElementById('pool-ctx');
  const ctxLbl = document.getElementById('pool-ctx-lbl');
  if (activeLoc) {
    ctx.classList.add('vis');
    const locName = [activeLoc.label, activeLoc.description].filter(Boolean).join(' — ');
    ctxLbl.innerHTML = `Assigning to: <strong>${esc(locName)}</strong>`;
  } else {
    ctx.classList.remove('vis');
  }

  const runs = [...S.current.runs].sort((a, b) =>
    b.session_date !== a.session_date
      ? b.session_date.localeCompare(a.session_date)
      : b.run_number - a.run_number
  );
  const html = runs.map(r => {
    // Carries the stable identity as well as the position: the run number this
    // was rendered with may be stale by the time the click posts.
    const key = `${r.session_date}|${r.run_number}|${r.source_file || ''}`;
    const p = timePeriod(r.start_time, a.standard);
    const pk = periodKey(p);
    const isAssigned = r.ar_id !== null;
    const isHere = isAssigned && activeArIds.has(r.ar_id);
    const canAdd = activeLoc && !isAssigned;
    const hidden = (!S.showAssigned && isAssigned && !isHere) ||
      (needle && !`${r.session_date} ${r.start_time} ${r.avg_laeq || ''}`.toLowerCase().includes(needle));
    if (!hidden) visible++;
    return `<div class="run-item p-${pk}${isAssigned ? ' assigned' : ''}${canAdd ? ' add-mode' : ''}${hidden ? ' hidden' : ''}"
      data-key="${key}"${canAdd ? ` onclick="doAssignOne('${key}')"` : ''}>
      <span class="ri-date">${fmtDate(r.session_date)}</span>
      <span class="ri-n">R${r.run_number}</span>
      <span class="ri-time">${r.start_time.slice(0,5)}${r.end_time ? '–' + r.end_time.slice(0,5) : ''}</span>
      <span class="ri-dur">${fmtDur(r.n_samples, r.step)}</span>
      <span class="ri-avg">${r.avg_laeq != null ? r.avg_laeq.toFixed(1) : '—'} dB</span>
      <span class="ri-right">
        <span class="ppill pp-${pk}">${esc(shortPeriod(p))}</span>
        ${r.assigned_location_label ? `<span class="badge-loc">${esc(r.assigned_location_label)}</span>` : ''}
        ${canAdd ? '<span class="run-add-btn">+</span>' : ''}
      </span>
    </div>`;
  }).join('');

  const body = document.getElementById('pool-body');
  body.innerHTML = html || '<div class="pool-empty">No runs in database yet.</div>';
  const total = runs.length;
  document.getElementById('pool-count').textContent =
    visible === total ? `${total} run${total !== 1 ? 's' : ''}` : `${visible} of ${total}`;
}

// ── Locations ─────────────────────────────────────────────────
function renderLocs() {
  const a = S.current.assessment;
  let h = '';

  for (const loc of a.locations) {
    const locName = [loc.label, loc.description].filter(Boolean).join(' — ');
    const runRows = loc.runs.length
      ? loc.runs.map(r => {
          const p = timePeriod(r.start_time, a.standard), pk = periodKey(p);
          return `<div class="loc-run-row">
            <span class="lrr-date">${fmtDate(r.session_date)}</span>
            <span class="lrr-time">${r.start_time.slice(0,5)}${r.end_time ? '–' + r.end_time.slice(0,5) : ''}</span>
            <span class="lrr-avg">${r.avg_laeq != null ? r.avg_laeq.toFixed(1) : '—'} dB</span>
            <span class="ppill pp-${pk}" style="flex-shrink:0">${esc(shortPeriod(p))}</span>
            <input type="text" class="lrr-cond" placeholder="conditions, notes…"
              value="${esc(r.conditions || '')}"
              onblur="saveRunCond(this, ${r.ar_id})"
              onkeydown="if(event.key==='Enter')this.blur()">
            <span class="lrr-rm" onclick="doUnassign(${r.ar_id})" title="Remove from location">×</span>
          </div>`;
        }).join('')
      : `<div class="loc-empty">${S.activeLoc === loc.id ? 'Click runs in the pool to add them here.' : 'Click this card to start assigning runs.'}</div>`;

    h += `<div class="loc-card${S.activeLoc === loc.id ? ' active' : ''}">
      <div class="loc-hdr" onclick="setActiveLoc(${loc.id}, event)" style="cursor:pointer">
        <div class="loc-avatar">${esc(loc.label.charAt(0))}</div>
        <div class="loc-label" contenteditable="true" spellcheck="false"
          data-loc="${loc.id}"
          onblur="saveLocLabel(this)"
          onfocus="this.dataset.orig=this.innerText"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${esc(loc.label)}</div>
        <div class="loc-desc-field" contenteditable="true" spellcheck="false"
          data-loc="${loc.id}" data-placeholder="add description…"
          onblur="saveLocField(this)"
          onfocus="this.dataset.orig=this.innerText"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
        >${esc(loc.description || '')}</div>
        <span class="loc-cnt">${loc.runs.length} run${loc.runs.length !== 1 ? 's' : ''}</span>
        <button class="loc-del" onclick="doDeleteLoc(${loc.id})">Remove</button>
      </div>
      <div class="loc-runs">${runRows}</div>
    </div>`;
  }

  // Add location inline form
  h += `<div class="add-loc-wrap">
    <div class="add-loc-form" id="add-loc-form">
      <div class="add-inputs">
        <input id="new-label" class="loc-inp" placeholder="Label (A, B…)" maxlength="12"
          style="width:80px;flex-shrink:0" onkeydown="if(event.key==='Enter')saveNewLoc()">
        <input id="new-desc" class="loc-inp" style="flex:1" placeholder="Description (e.g. Front of property)"
          onkeydown="if(event.key==='Enter')saveNewLoc()">
      </div>
      <div class="add-actions">
        <button class="btn-xs-p" onclick="saveNewLoc()">Add location</button>
        <button class="btn-xs-s" onclick="hideAddLoc()">Cancel</button>
      </div>
    </div>
    <button class="add-loc-trigger" id="add-loc-trigger" onclick="showAddLoc()">+ Add sub-location</button>
  </div>`;

  document.getElementById('locs-body').innerHTML = h;
}

// ── Orchestration ─────────────────────────────────────────────
function renderAll() {
  renderSidebar();
  if (!S.currentId || !S.current) return;
  renderHeader();
  renderPool();
  renderLocs();
}

async function openAssessment(id) {
  S.currentId = id;
  S.activeLoc = null;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('assess-panel').style.display = 'flex';
  renderSidebar();
  const res = await fetch(`/api/assessments/${id}`);
  S.current = await res.json();
  renderHeader();
  renderPool();
  renderLocs();
}

async function reloadCurrent() {
  const res = await fetch(`/api/assessments/${S.currentId}`);
  S.current = await res.json();
  renderAll();
  await loadAssessments();
}

// ── Interactions ──────────────────────────────────────────────
function setActiveLoc(locId, event) {
  if (event && (event.target.isContentEditable || event.target.tagName === 'BUTTON')) return;
  S.activeLoc = (S.activeLoc === locId) ? null : locId;
  renderPool();
  renderLocs();
}

function clearActiveLoc() {
  S.activeLoc = null;
  renderPool();
  renderLocs();
}

async function doAssignOne(key) {
  if (!S.activeLoc) return;
  const locId = S.activeLoc;
  const [date, rn, srcFile] = key.split('|');
  await fetch(`/api/assessments/${S.currentId}/assign`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ location_id: locId,
        runs: [{ date, run_number: parseInt(rn), source_file: srcFile || null }] }),
  });
  S.activeLoc = locId;
  await reloadCurrent();
}

async function doUnassign(arId) {
  await fetch(`/api/assessment-runs/${arId}`, { method: 'DELETE' });
  await reloadCurrent();
}

function toggleShowAssigned() {
  S.showAssigned = !S.showAssigned;
  const btn = document.getElementById('show-assigned-btn');
  btn.classList.toggle('on', S.showAssigned);
  btn.textContent = S.showAssigned ? 'Hide assigned' : 'Show assigned';
  renderPool();
}

// ── Location CRUD ─────────────────────────────────────────────
function showAddLoc() {
  document.getElementById('add-loc-form').classList.add('open');
  document.getElementById('add-loc-trigger').style.display = 'none';
  document.getElementById('new-label').value = '';
  document.getElementById('new-desc').value = '';
  document.getElementById('new-label').focus();
}

function hideAddLoc() {
  document.getElementById('add-loc-form').classList.remove('open');
  document.getElementById('add-loc-trigger').style.display = '';
}

async function saveNewLoc() {
  const label = document.getElementById('new-label').value.trim();
  const desc = document.getElementById('new-desc').value.trim();
  if (!label) { document.getElementById('new-label').focus(); return; }
  await fetch(`/api/assessments/${S.currentId}/locations`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label, description: desc }),
  });
  await reloadCurrent();
}

async function saveLocLabel(el) {
  const locId = el.dataset.loc;
  const newLabel = el.innerText.trim();
  const orig = (el.dataset.orig || '').trim();
  if (!newLabel) { el.innerText = orig; return; }
  if (newLabel === orig) return;
  const loc = S.current.assessment.locations.find(l => l.id == locId);
  if (!loc) return;
  await fetch(`/api/assessments/${S.currentId}/locations/${locId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: newLabel, description: loc.description, lat: loc.lat, lng: loc.lng, notes: loc.notes }),
  });
  loc.label = newLabel;
  renderLocs();
  renderHeader();
}

async function saveLocField(el) {
  const locId = el.dataset.loc;
  const newDesc = el.innerText.trim();
  if (newDesc === (el.dataset.orig || '').trim()) return;
  const loc = S.current.assessment.locations.find(l => l.id == locId);
  if (!loc) return;
  await fetch(`/api/assessments/${S.currentId}/locations/${locId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: loc.label, description: newDesc, lat: loc.lat, lng: loc.lng, notes: loc.notes }),
  });
  loc.description = newDesc;
  renderHeader();
}

async function saveRunCond(input, arId) {
  await fetch(`/api/assessment-runs/${arId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conditions: input.value.trim(), notes: '' }),
  });
}

async function doDeleteLoc(locId) {
  const loc = S.current.assessment.locations.find(l => l.id === locId);
  const n = loc ? loc.runs.length : 0;
  const msg = n > 0
    ? `Remove sub-location "${loc.label}" and unassign its ${n} run${n !== 1 ? 's' : ''}?`
    : `Remove sub-location "${loc?.label || ''}"?`;
  if (!confirm(msg)) return;
  await fetch(`/api/assessments/${S.currentId}/locations/${locId}`, { method: 'DELETE' });
  await reloadCurrent();
}

// ── Assessment modal ──────────────────────────────────────────
function showNewAssessment() {
  document.getElementById('modalTitle').textContent = 'New Assessment';
  document.getElementById('assessForm').reset();
  document.getElementById('assessFormId').value = '';
  document.getElementById('assessModal').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}

function showEditAssessment() {
  const a = S.current.assessment;
  document.getElementById('modalTitle').textContent = 'Edit Assessment';
  document.getElementById('assessFormId').value = a.id;
  document.getElementById('fName').value = a.name || '';
  document.getElementById('fPurpose').value = a.purpose || '';
  document.getElementById('fStandard').value = a.standard || 'noise_act';
  document.getElementById('fClientRef').value = a.client_ref || '';
  document.getElementById('fAddress').value = a.address || '';
  document.getElementById('fPostcode').value = a.postcode || '';
  document.getElementById('fNotes').value = a.notes || '';
  document.getElementById('assessModal').classList.add('open');
}

function closeModal() {
  document.getElementById('assessModal').classList.remove('open');
}

async function submitAssessForm() {
  const id = document.getElementById('assessFormId').value;
  const data = {
    name: document.getElementById('fName').value.trim(),
    purpose: document.getElementById('fPurpose').value.trim(),
    standard: document.getElementById('fStandard').value,
    client_ref: document.getElementById('fClientRef').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    postcode: document.getElementById('fPostcode').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
  };
  if (!data.name) { document.getElementById('fName').focus(); return; }
  if (id) {
    await fetch(`/api/assessments/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    await reloadCurrent();
  } else {
    const res = await fetch('/api/assessments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const { id: newId } = await res.json();
    await loadAssessments();
    await openAssessment(newId);
  }
  closeModal();
}

async function confirmDeleteAssessment(id) {
  const a = S.current?.assessment;
  if (!confirm(`Delete assessment "${a?.name || id}"?\n\nThis removes the assessment and all location/run assignments. The underlying recordings are not deleted.`)) return;
  await fetch(`/api/assessments/${id}`, { method: 'DELETE' });
  S.currentId = null;
  S.current = null;
  document.getElementById('assess-panel').style.display = 'none';
  document.getElementById('empty-state').style.display = '';
  await loadAssessments();
}

// ── Filters & keyboard ────────────────────────────────────────
document.getElementById('pool-search').addEventListener('input', function() {
  S.filterText = this.value;
  renderPool();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Boot ──────────────────────────────────────────────────────
loadAssessments().then(() => {
  const openId = new URLSearchParams(location.search).get('open');
  if (openId) openAssessment(parseInt(openId));
});
</script>
</body>
</html>
